apiVersion: v1
kind: Pod
metadata:
  name: init-web
spec:
  initContainers:
  - name: svc-check
    image: nicolaka/netshoot
    command: ['sh', '-c', 'until nslookup init-web-svc; do echo "waiting for init-web-svc to start"; sleep 5; done']
  containers:
  - name: web
    image: nginx
    ports:
    - containerPort: 80
